# CI per spec 01 §7: runs on every push and pull request. No secrets are needed; tests use fixtures
# for every third-party call.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      # Test Postgres from infra/compose.test.yml (spec 01 §3 defaults).
      PG_TEST_PORT: '5433'
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Installs the pnpm version pinned in the `packageManager` field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # The vitest configs of feeds, ranker, questions and engine fail below 80 % line coverage.
      - name: Unit tests with coverage
        run: pnpm test -- --coverage

      - name: Start test Postgres
        run: pnpm db:test:up

      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

      # E2E (`pnpm e2e`) is added in M6 (spec 01 §7 step 7).

      - name: Show test Postgres logs
        if: failure()
        run: docker compose -f infra/compose.test.yml logs --no-color --tail 200
